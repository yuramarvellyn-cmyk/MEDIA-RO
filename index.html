<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petualangan Jawa Barat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        /* Screen 1: Input Nama */
        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        h2 {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 20px;
        }

        p {
            color: #666;
            font-size: 1.1em;
            margin: 15px 0;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            font-size: 1em;
            border: 2px solid #667eea;
            border-radius: 10px;
            text-align: center;
        }

        input:focus {
            outline: none;
            box-shadow: 0 0 10px #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(-1px);
        }

        /* Screen 2: Game Area */
        .game-area {
            background: linear-gradient(to bottom, #87CEEB, #90EE90);
            border-radius: 15px;
            padding: 40px 20px;
            margin: 30px 0;
            min-height: 300px;
            position: relative;
            overflow: hidden;
        }

        .path {
            position: absolute;
            bottom: 50px;
            left: 0;
            right: 0;
            height: 30px;
            background: repeating-linear-gradient(
                90deg,
                #DAA520 0px,
                #DAA520 20px,
                transparent 20px,
                transparent 40px
            );
            border-radius: 15px;
        }

        .character {
            position: absolute;
            bottom: 60px;
            left: 30px;
            font-size: 3em;
            transition: left 2s ease-in-out;
        }

        .destination {
            position: absolute;
            bottom: 60px;
            right: 30px;
            font-size: 3em;
        }

        .game-status {
            color: #333;
            margin-top: 30px;
            font-size: 1.1em;
            font-weight: bold;
        }

        /* Screen 3: Quiz */
        .quiz-container {
            margin: 30px 0;
        }

        .question {
            background: #f0f0f0;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 1.2em;
            color: #333;
            line-height: 1.5;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 20px 0;
        }

        .option-btn {
            background: #f0f0f0;
            color: #333;
            padding: 15px;
            font-size: 1em;
            border: 2px solid #ccc;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .option-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .option-btn.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .option-btn.correct {
            background: #28a745;
            color: white;
            border-color: #28a745;
        }

        .option-btn.incorrect {
            background: #dc3545;
            color: white;
            border-color: #dc3545;
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        /* Screen 4: Result */
        .result-container {
            margin: 30px 0;
        }

        .result-icon {
            font-size: 5em;
            margin: 20px 0;
        }

        .result-title {
            color: #667eea;
            font-size: 2em;
            margin: 15px 0;
        }

        .result-message {
            color: #666;
            font-size: 1.1em;
            margin: 15px 0;
        }

        .player-name-display {
            color: #764ba2;
            font-weight: bold;
            font-size: 1.2em;
            margin: 10px 0;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2em;
            }

            h2 {
                font-size: 1.5em;
            }

            .character {
                font-size: 2em;
            }

            .destination {
                font-size: 2em;
            }

            .option-btn {
                font-size: 0.95em;
                padding: 12px;
            }

            .result-icon {
                font-size: 3em;
            }

            .result-title {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- SCREEN 1: Input Nama -->
        <div id="screen-name" class="screen active">
            <h1>🏔️ PETUALANGAN JAWA BARAT</h1>
            <p>Selamat datang di perjalanan sederhana menuju Monumen Bandung!</p>
            <input type="text" id="player-name" placeholder="Masukkan namamu..." required>
            <button onclick="startGame()">Mulai Petualangan</button>
        </div>

        <!-- SCREEN 2: Game Area (Character Moving) -->
        <div id="screen-game" class="screen">
            <h2>Perjalanan Dimulai...</h2>
            <div class="game-area">
                <div class="path"></div>
                <div class="character" id="character">🚶</div>
                <div class="destination">🏛️</div>
            </div>
            <div class="game-status" id="game-status">Karakter sedang berjalan ke Monumen Bandung...</div>
        </div>

        <!-- SCREEN 3: Quiz -->
        <div id="screen-quiz" class="screen">
            <h2>Tantangan Edukasi</h2>
            <div class="quiz-container">
                <div class="question" id="question-text"></div>
                <div class="options" id="quiz-options"></div>
                <button id="submit-btn" onclick="submitAnswer()" style="display: none;">Kirim Jawaban</button>
            </div>
        </div>

        <!-- SCREEN 4: Result -->
        <div id="screen-result" class="screen">
            <div class="result-container">
                <div class="result-icon" id="result-icon">✅</div>
                <h2 class="result-title" id="result-title">BENAR!</h2>
                <div class="player-name-display" id="player-result-name"></div>
                <div class="result-message" id="result-message">Selamat! Kamu berhasil menyelesaikan perjalanan dengan jawaban yang benar!</div>
                <button onclick="location.reload()">Mainkan Lagi</button>
            </div>
        </div>
    </div>

    <script>
        let playerName = '';
        let selectedAnswer = null;
        let correctAnswer = '';

        // Data soal edukasi tentang Jawa Barat
        const quiz = {
            question: "Monumen Bandung juga dikenal dengan nama?",
            options: [
                { text: "Candi Borobudur", correct: false },
                { text: "Tugu Bandung", correct: true },
                { text: "Monas", correct: false },
                { text: "Candi Prambanan", correct: false }
            ]
        };

        function startGame() {
            playerName = document.getElementById('player-name').value.trim();
            if (!playerName) {
                alert('Masukkan namamu terlebih dahulu!');
                return;
            }
            showScreen('screen-game');
            animateCharacter();
        }

        function animateCharacter() {
            const character = document.getElementById('character');
            // Animasi karakter berjalan selama 2 detik
            setTimeout(() => {
                character.style.left = 'calc(100% - 80px)';
                
                // Setelah animasi selesai, tampilkan quiz
                setTimeout(() => {
                    showQuiz();
                }, 2000);
            }, 100);
        }

        function showQuiz() {
            const options = document.getElementById('quiz-options');
            options.innerHTML = '';
            
            document.getElementById('question-text').textContent = quiz.question;
            
            quiz.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option.text;
                btn.onclick = () => selectAnswer(index, option.correct);
                options.appendChild(btn);
            });

            showScreen('screen-quiz');
        }

        function selectAnswer(index, isCorrect) {
            // Deselect previous
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.classList.remove('selected', 'correct', 'incorrect');
            });
            
            // Select current
            document.querySelectorAll('.option-btn')[index].classList.add('selected');
            selectedAnswer = index;
            correctAnswer = isCorrect;
            
            // Show submit button
            document.getElementById('submit-btn').style.display = 'inline-block';
        }

        function submitAnswer() {
            if (selectedAnswer === null) return;
            
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === selectedAnswer) {
                    if (correctAnswer) {
                        btn.classList.add('correct');
                    } else {
                        btn.classList.add('incorrect');
                    }
                }
            });

            // Show result setelah 1 detik
            setTimeout(() => {
                showResult(correctAnswer);
            }, 1000);
        }

        function showResult(isCorrect) {
            const resultIcon = document.getElementById('result-icon');
            const resultTitle = document.getElementById('result-title');
            const resultMessage = document.getElementById('result-message');
            const playerResultName = document.getElementById('player-result-name');

            if (isCorrect) {
                resultIcon.textContent = '✅';
                resultTitle.textContent = 'BENAR!';
                resultTitle.style.color = '#28a745';
                resultMessage.textContent = `Luar biasa, ${playerName}! Kamu berhasil menyelesaikan perjalanan dengan jawaban yang benar! 🎉`;
            } else {
                resultIcon.textContent = '❌';
                resultTitle.textContent = 'SALAH!';
                resultTitle.style.color = '#dc3545';
                resultMessage.textContent = `Opps, ${playerName}! Jawaban kamu kurang tepat. Coba lagi untuk belajar lebih banyak tentang Jawa Barat! 📚`;
            }

            playerResultName.textContent = `Pemain: ${playerName}`;
            showScreen('screen-result');
        }

        function showScreen(screenId) {
            // Hide all screens
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            // Show target screen
            document.getElementById(screenId).classList.add('active');
        }
    </script>
</body>
</html>
